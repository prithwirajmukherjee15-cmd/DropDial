name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build app folder (for the installer)
        run: pyinstaller DragShift.spec --noconfirm

      - name: Build portable DragShift.exe
        run: pyinstaller DragShift.spec --noconfirm
        env:
          ONEFILE: "1"

      - name: Smoke-test both builds
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          foreach ($exe in @("dist\DragShift\DragShift.exe", "dist\DragShift.exe")) {
            $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Self-test failed for $exe ($($p.ExitCode))" }
            "Self-test passed: $exe"
          }
          "{0:N1} MB portable" -f ((Get-Item dist\DragShift.exe).Length / 1MB)

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc installer\DragShift.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          "{0:N1} MB installer" -f ((Get-Item dist\DragShift-Setup.exe).Length / 1MB)

      - name: Test the installer (silent install, run, uninstall)
        shell: pwsh
        run: |
          $p = Start-Process dist\DragShift-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=contextmenu" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Install failed ($($p.ExitCode))" }
          $app = "$env:LOCALAPPDATA\Programs\DragShift\DragShift.exe"
          if (-not (Test-Path $app)) { throw "App not installed" }
          if (-not (Test-Path "HKCU:\Software\Classes\*\shell\DragShift\command")) { throw "Context menu not registered" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $t = Start-Process $app -ArgumentList "--selftest" -Wait -PassThru
          if ($t.ExitCode -ne 0) { throw "Installed app self-test failed" }
          Remove-Item Env:QT_QPA_PLATFORM
          $u = Start-Process "$env:LOCALAPPDATA\Programs\DragShift\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait -PassThru
          Start-Sleep 3
          if (Test-Path "HKCU:\Software\Classes\*\shell\DragShift") { throw "Uninstall left the context menu behind" }
          "Installer OK"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/DragShift.exe
            dist/DragShift-Setup.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: apple-silicon
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build DragShift.app
        run: pyinstaller DragShift.spec --noconfirm

      - name: Self-test the app bundle
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/DragShift.app/Contents/MacOS/DragShift --selftest
          codesign --verify --deep --verbose=2 dist/DragShift.app || true
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" dist/DragShift.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSHumanReadableCopyright" dist/DragShift.app/Contents/Info.plist

      - name: Sign & notarize the app (only when Apple credentials are configured)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "No Apple Developer ID configured: shipping ad-hoc signed (users see Gatekeeper's warning)."
            exit 0
          fi
          KC=build.keychain; KCPW=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p "$KCPW" $KC
          security set-keychain-settings -lut 21600 $KC
          security unlock-keychain -p "$KCPW" $KC
          security import cert.p12 -k $KC -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s $KC $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" $KC
          # sign every nested binary first, then the bundle (hardened runtime + timestamp)
          find dist/DragShift.app/Contents -type f \( -name "*.so" -o -name "*.dylib" -o -perm -111 \) -print0 |
            xargs -0 -I{} codesign --force --timestamp --options runtime --entitlements installer/entitlements.plist --sign "$MACOS_SIGN_IDENTITY" "{}" || true
          codesign --force --deep --timestamp --options runtime --entitlements installer/entitlements.plist --sign "$MACOS_SIGN_IDENTITY" dist/DragShift.app
          codesign --verify --deep --strict --verbose=2 dist/DragShift.app
          ditto -c -k --keepParent dist/DragShift.app DragShift.zip
          xcrun notarytool submit DragShift.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple dist/DragShift.app
          spctl --assess --type execute --verbose dist/DragShift.app
          echo "SIGNED=1" >> $GITHUB_ENV

      - name: Make the branded .dmg (drag DragShift to Applications)
        env:
          VOLNAME: DragShift by Prithwiraj Mukherjee
        run: |
          DMG="dist/DragShift-mac-${{ matrix.arch }}.dmg"
          rm -f "$DMG"
          mkdir -p dmgsrc && cp -R dist/DragShift.app dmgsrc/
          # Retina-ready background: 1x + 2x combined into one TIFF
          tiffutil -cathidpicheck packaging/mac/dmg-background.png packaging/mac/dmg-background@2x.png -out dmg-background.tiff
          brew install create-dmg >/dev/null 2>&1 || true
          if command -v create-dmg >/dev/null && create-dmg \
              --volname "$VOLNAME" --volicon dragshift/assets/dragshift.icns \
              --background dmg-background.tiff --window-pos 200 140 --window-size 660 420 \
              --icon-size 112 --text-size 13 --icon "DragShift.app" 165 215 --hide-extension "DragShift.app" \
              --app-drop-link 495 215 "$DMG" dmgsrc; then
            echo "Branded DMG built"
          else
            # Finder styling can time out on CI machines: still ship a working DMG with the credit
            echo "::warning::create-dmg failed, building a plain DMG"
            rm -f "$DMG"
            ln -s /Applications dmgsrc/Applications
            mkdir -p dmgsrc/.background && cp dmg-background.tiff dmgsrc/.background/background.tiff
            hdiutil create -volname "$VOLNAME" -srcfolder dmgsrc -ov -format UDZO "$DMG"
          fi
          du -h "$DMG"
          # check the credit made it in
          hdiutil attach "$DMG" -mountpoint /tmp/dmgcheck -nobrowse -quiet
          ls -la /tmp/dmgcheck
          test -d /tmp/dmgcheck/DragShift.app
          /usr/libexec/PlistBuddy -c "Print :NSHumanReadableCopyright" /tmp/dmgcheck/DragShift.app/Contents/Info.plist
          hdiutil detach /tmp/dmgcheck -quiet
          if [ "$SIGNED" = "1" ]; then
            codesign --force --timestamp --sign "${{ secrets.MACOS_SIGN_IDENTITY }}" "$DMG"
            xcrun notarytool submit "$DMG" --apple-id "${{ secrets.APPLE_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" --wait
            xcrun stapler staple "$DMG"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: dist/DragShift-mac-${{ matrix.arch }}.dmg

  linux:
    # Built on Debian 12 (glibc 2.36): the .deb runs on Debian 12/13, Ubuntu 23.04+, Mint 22, MX 23…
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - name: System packages
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            git ca-certificates python3 python3-venv python3-dev binutils dpkg-dev file \
            libx11-6 libxext6 libxrender1 libxkbcommon0 libxkbcommon-x11-0 libxcb1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libfreetype6 \
            libdbus-1-3 libegl1 libgl1 libglib2.0-0 \
            xvfb xfwm4 thunar xdotool dbus-x11 ffmpeg feh fonts-dejavu-core fonts-noto-core \
            desktop-file-utils hicolor-icon-theme xdg-utils

      - uses: actions/checkout@v4

      - name: Python environment
        run: |
          # Python 3.12 (portable build via uv): Debian 12's 3.11 hits a C-extension refcount bug
          # on None that is harmless on 3.12+ (None is immortal there)
          python3 -m venv /opt/uv && /opt/uv/bin/pip install -q uv
          /opt/uv/bin/uv python install 3.12
          /opt/uv/bin/uv venv -p 3.12 /opt/venv
          VIRTUAL_ENV=/opt/venv /opt/uv/bin/uv pip install -q -r requirements.txt pyinstaller pytest
          /opt/venv/bin/python --version

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: /opt/venv/bin/python -m pytest -q

      - name: Build the app folder
        run: /opt/venv/bin/pyinstaller DragShift.spec --noconfirm

      - name: Build the .deb
        run: |
          PATH=/opt/venv/bin:$PATH packaging/linux/build-deb.sh 2.0.0
          dpkg-deb --info dist/DragShift-linux-amd64.deb
          desktop-file-validate packaging/linux/dragshift.desktop

      - name: Install the .deb and self-test it
        env:
          QT_QPA_PLATFORM: offscreen
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          mkdir -p e2e_linux_out
          apt-get install -y -q ./dist/DragShift-linux-amd64.deb 2>&1 | tail -5
          test -x /usr/bin/dragshift
          set +e
          dragshift --selftest > e2e_linux_out/selftest.txt 2>&1
          rc=$?
          set -e
          echo "exit code $rc" >> e2e_linux_out/selftest.txt
          cat ~/.local/share/DragShift/log.txt >> e2e_linux_out/selftest.txt 2>/dev/null || true
          if [ $rc -ne 0 ]; then
            /opt/venv/bin/python -X faulthandler -m dragshift --selftest >> e2e_linux_out/selftest.txt 2>&1 || true
            cat ~/.local/share/DragShift/log.txt >> e2e_linux_out/selftest.txt 2>/dev/null || true
          fi
          cat e2e_linux_out/selftest.txt
          if [ $rc -ne 0 ]; then
            tail -25 e2e_linux_out/selftest.txt | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=selftest::$l"; done
            exit $rc
          fi

      - name: End-to-end on XFCE (Xvfb + xfwm4 with compositor off + Thunar)
        run: |
          export DISPLAY=:99 LANG=C.UTF-8 LC_ALL=C.UTF-8
          Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 &
          sleep 2
          eval $(dbus-launch --sh-syntax)
          /opt/venv/bin/python -c "from dragshift.imaging import gradient; gradient((1280, 800), ['#ffb36b', '#ff5f6d', '#c2508f', '#7b8cff'], 160).save('/tmp/wall.png')"
          xfwm4 --compositor=off >/tmp/xfwm4.log 2>&1 &
          sleep 2
          feh --no-fehbg --bg-fill /tmp/wall.png
          /opt/venv/bin/python demo/e2e_linux.py || { tail -15 e2e_linux_out/log.txt | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=e2e::$l"; done; exit 1; }

      - name: Summary
        if: always()
        run: cat e2e_linux_out/results.md >> $GITHUB_STEP_SUMMARY || true

      - name: Save results to the e2e-linux-output branch
        if: always() && github.event_name == 'push'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /tmp/o && cp -r e2e_linux_out/* /tmp/o/ || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan e2e-linux-output
          git rm -rfq . || true
          git clean -fdxq -e dist || true
          cp -r /tmp/o/* . || true
          echo "Run ${GITHUB_SHA}" > RUN.txt
          git add -A -- . ':!dist'
          git commit -qm "Debian/XFCE E2E results ${GITHUB_SHA}"
          git push -f origin e2e-linux-output

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-deb
          path: dist/DragShift-linux-amd64.deb

  publish:
    needs: [windows, macos, linux]
    if: >-
      always() && github.event_name == 'push' &&
      (needs.windows.result == 'success' || needs.macos.result == 'success' || needs.linux.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - run: ls -la out

      - name: Publish download (latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DragShift (latest build)
          make_latest: true
          body: |
            **DragShift 2** for Mac, Windows and Linux · Made by Prithwiraj Mukherjee

            | Platform | Direct download |
            |---|---|
            | 🍎 Mac (Apple Silicon: M1–M4) | [DragShift-mac-apple-silicon.dmg](https://github.com/prithwirajmukherjee15-cmd/dragshift/releases/latest/download/DragShift-mac-apple-silicon.dmg) |
            | 🍎 Mac (Intel) | [DragShift-mac-intel.dmg](https://github.com/prithwirajmukherjee15-cmd/dragshift/releases/latest/download/DragShift-mac-intel.dmg) |
            | 🪟 Windows installer (recommended) | [DragShift-Setup.exe](https://github.com/prithwirajmukherjee15-cmd/dragshift/releases/latest/download/DragShift-Setup.exe) |
            | 🪟 Windows portable | [DragShift.exe](https://github.com/prithwirajmukherjee15-cmd/dragshift/releases/latest/download/DragShift.exe) |
            | 🐧 Linux (Debian/Ubuntu .deb) | [DragShift-linux-amd64.deb](https://github.com/prithwirajmukherjee15-cmd/dragshift/releases/latest/download/DragShift-linux-amd64.deb) |

            **Mac**, easiest with no security warning: paste into Terminal
            `curl -fsSL https://raw.githubusercontent.com/prithwirajmukherjee15-cmd/dragshift/main/install-mac.sh | bash`
            Using the .dmg instead: open it and drag DragShift into Applications. On first launch (until DragShift is notarized by Apple) open it once and click **Done**, then **System Settings → Privacy & Security → Open Anyway**. Or in Terminal: `xattr -dr com.apple.quarantine /Applications/DragShift.app`

            **Windows**: run DragShift-Setup.exe (per-user, no admin). If SmartScreen warns, click **More info → Run anyway**.

            **Linux** (Debian 12+, Ubuntu 23.04+, Mint, MX… on X11 desktops such as XFCE, MATE, Cinnamon): `sudo apt install ./DragShift-linux-amd64.deb`, then open DragShift from the app menu.

            **New in 2.0:** a premium midnight-and-gold look, video & audio, SVG and e-books, watermarks, recipes, watch folders, history and a command line.

            Built automatically from commit ${{ github.sha }}.
          files: out/*

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
