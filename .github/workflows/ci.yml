name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen       # no screen needed for the tests
  DROPDIAL_NO_UPDATE_CHECK: "1"    # never talk to the network
  PYTHONUTF8: "1"                  # the CLI prints ✓ and →, even on a Windows console
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libfontconfig1 libfreetype6 libdbus-1-3 fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Compile check
        run: python -m compileall -q dropdial

      - name: Command-line smoke test
        run: |
          python -m dropdial --version
          python -m dropdial --help
          python -m dropdial formats

      - name: Run tests
        run: python -m pytest -q
