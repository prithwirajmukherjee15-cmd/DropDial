name: Record demo video

on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyautogui pywinauto imageio-ffmpeg

      - name: Record
        run: python demo/record_demo.py

      - name: Publish recording
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-recording
          name: Demo recording (automated)
          prerelease: true
          body: Screen recording of DropDial driven automatically on a Windows machine.
          files: demo_out/*

      - name: Attach results to this run (screenshots, recording, table)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-recording
          path: demo_out/
          if-no-files-found: ignore
          retention-days: 30
